name: Publish PokéDex Fullstack Image (Gitea)

on:
  push:
    branches:
      - production
    tags:
      - "v*"
    paths:
      - "frontend/**"
      - "backend/**"
      - "Dockerfile"
      - "nginx-combined.conf"
      - "supervisord.conf"
      - "entrypoint-combined.sh"
      - ".gitea/workflows/publish-app.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          REDIS_URL: "redis://localhost:6379"
        run: python3 -m pytest tests/ -v

  build-and-push:
    name: Build & Push Fullstack Image
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set registry vars
        id: vars
        env:
          GITEA_SERVER_URL: ${{ github.server_url }}
        run: |
          registry_host="${GITEA_SERVER_URL#http://}"
          registry_host="${registry_host#https://}"
          registry_host="${registry_host%/}"
          echo "registry=${registry_host}" >> "$GITHUB_OUTPUT"
          echo "owner_lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ steps.vars.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and Push Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/${{ steps.vars.outputs.owner_lowercase }}/pokedex-app:latest
            ${{ github.ref_name != '' && format('{0}/{1}/pokedex-app:{2}', steps.vars.outputs.registry, steps.vars.outputs.owner_lowercase, github.ref_name) || '' }}
          build-args: |
            VERSION=${{ github.ref_name != '' && github.ref_name || github.sha }}
